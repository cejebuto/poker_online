server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Dev machines accumulate large cookies on localhost from other projects;
  # the 8k default rejects those requests with "400 Request Header Too Large".
  large_client_header_buffers 8 32k;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    proxy_pass http://api:3001/health;
    proxy_http_version 1.1;
  }

  location /ws {
    proxy_pass http://api:3001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Roulette runs on a dedicated WS server inside the api container (:3002).
  location /roulette {
    proxy_pass http://api:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
