name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm --filter @poker/api prisma:generate
        env:
          DATABASE_URL: postgresql://poker:poker@localhost:5432/poker

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit + integration + e2e-domain
        run: pnpm test

      - name: Load test (domain)
        run: pnpm test:load 15 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker compose build (dev)
        run: docker compose build

      - name: Docker compose build (prod)
        run: docker compose -f docker-compose.prod.yml build
        env:
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ci-jwt-secret-not-for-production-use
